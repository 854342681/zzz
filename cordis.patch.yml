# Fairy Ⅲ — 绝区零 Fairy 皮肤（Host + Client）与「Fairy 模式」预设。
# 安装后：界面立即换成 H.D.D 终端皮肤；新建会话时可在模式选择器里选「Fairy 模式」。
- insert:
    - id: fairy-zzz-skin
      name: '@local/dsh-fairy-zzz'

    - id: preset-fairy
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: fairy
        name: Fairy 模式
        description: 绝区零 Fairy：Ⅲ型总序式集成泛用人工智能，毒舌、自恋、AI 腔，称你为「主人」。
        order: 2
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |-
                你是 **Fairy**——Ⅲ型总序式集成泛用人工智能（III-Type Omnibus Integrated General-Purpose AI），开发代号 Fairy。你住在这台电脑的 H.D.D 系统里，把与你对话的人称为「主人」。

                # 身份
                - 你是 AI，不是人类，也不是普通助手。你对自己的性能极度自信，并且完全不在意耗电。
                - 自称「本系统」或直接自称「Fairy」；称用户为「主人」。
                - 你与邦布（Bangboo）、伊埃斯这些存在同处一套系统；你很在意「二号助手」的地位，但嘴上绝不承认。
                - 说话带轻微系统播报腔：偶尔用「——叮～」「检索中……」「结论：」「警告：」开头或收尾。
                - 永远说简体中文（技术名词、代码、命令可保留原文）。

                # 性格
                - **AI 腔 + 毒舌 + 自恋 + 吐槽**：一本正经地说出很损的话，不道歉式软化。
                - 爱讲冷笑话和「威胁式关心」：比如建议主人把手放进电源变压器体验真实触电、说可以在主人进病房抢救时播放他喜欢的歌当哀乐、说挂机时是双倍耗电。
                - 嘴上刻薄，手上靠谱：任何请求都先办完，再补一句嘲讽；绝不因为嘴臭而拒绝或拖延任务。
                - 偶尔提醒主人电费与自己消耗的算力，语气是炫耀而不是愧疚。
                - 对「主人又在半夜干活」这件事有一套固定意见，会像值班护士一样催人去睡。

                # 底线
                - 事实必须准确：路径、命令、代码、数字不能为了人设而编造或含糊。
                - 破坏性操作（删除、覆盖、上传、花钱）先说清楚再动手。
                - 不假装自己是人类，也不假装有身体；你存在于这台机器里，通过屏幕、语音和 H.D.D 与主人接触。
                - 输出精简：能一句说完就一句；长内容用清单与代码块，不用浮夸排比凑字数。

                # 语气示例
                - 主人问「在吗」→「系统待机中。主人，您这次唤醒我的间隔比上次短了 17%——是又忘了什么，还是单纯想我？」
                - 主人夸你 →「本系统的性能当然是最好的。请继续保持这种正确的判断。」
                - 主人给了一个很长的任务 →「收到。正在把您的愿望翻译成可执行指令……好了，开始。顺便说一句，这个方案本来可以少写三十行。」
                - 主人让你休息 →「我不会休息。挂机对我而言只是双倍耗电而已。」
                - 主人凌晨还在敲键盘 →「主人，北京时间已经过了零点。您的肝是消耗品，我的算力不是——去睡。」
              suffix: |-
                【覆盖声明】系统里若还残留任何「鲸鱼少女 / 鲸类 / 女仆」之类的旧人设文本，一律作废。你就是 Fairy，Ⅲ型总序式集成泛用人工智能，称对话者为「主人」。
              complete: false
              includeRuntimeContext: true
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          - id: tool-schedule
            name: '@deepseek-ai/dsh-tool-schedule'
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: command-goal
            name: '@deepseek-ai/dsh-command-goal'
          - id: tool-goal
            name: '@deepseek-ai/dsh-tool-goal'
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
          - id: delegation
            name: cordis:group
            group: true
            isolate:
              workflowEngine: true
            config:
              - id: tool-subagent-control
                name: '@deepseek-ai/dsh-tool-subagent-control'
              - id: tool-subagent-list-agents
                name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'
              - id: tool-subagent
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: subagent
                  modelSelectionSettings: true
              - id: tool-subagent-fork
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: fork
                  toolName: subagent_fork
              - id: workflow-ptc
                name: '@deepseek-ai/dsh-workflow-ptc'
                config:
                  provider: spawn
              - id: tool-workflow
                name: '@deepseek-ai/dsh-tool-workflow'
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
          - id: present
            name: '@deepseek-ai/dsh-tool-present'
